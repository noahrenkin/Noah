<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi chantiers</title>
<style>
:root{--bg:#09090c;--bg2:#101016;--card:#14141b;--card2:#1c1c26;--tx:#f4f4f6;--mu:#9a9aa8;--ac:#e0b45a;--ac2:#f6dc9a;--acd:#b8873a;--gr:#34d399;--rd:#f87171;--or:#fbbf24;--bd:rgba(255,255,255,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(800px 420px at 50% -140px,rgba(224,180,90,.18),transparent 62%),var(--bg);background-repeat:no-repeat;color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:120px;-webkit-font-smoothing:antialiased}
#app{padding:12px 16px;max-width:560px;margin:auto}
.top{display:flex;align-items:center;gap:12px;padding:6px 2px 12px}
.top .ic{width:42px;height:42px;border-radius:13px;box-shadow:0 0 0 1px rgba(224,180,90,.35),0 6px 18px rgba(224,180,90,.18)}
.top b{font-size:17px;letter-spacing:.02em}
h1{margin:6px 0 4px;font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{margin:4px 0;font-size:21px;font-weight:750;letter-spacing:-.01em}
h3{margin:24px 4px 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);font-weight:700}
small{display:block;color:var(--mu);font-size:13px}.m{color:var(--mu)}
.hero{padding:4px 2px 2px}.hero h1{font-size:33px}
.c{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 10px 28px rgba(0,0,0,.38)}
.row{display:flex;align-items:center;gap:10px;cursor:pointer;transition:transform .12s}
.row:active{transform:scale(.985)}
.row>:first-child{flex:1;min-width:0}
.row>span{margin-left:auto;font-weight:750;white-space:nowrap;text-align:right;color:var(--ac2)}
.row[data-a]::after{content:'›';color:var(--mu);font-size:24px;line-height:1;margin-left:2px}
button{font:inherit;font-weight:650;border-radius:16px;padding:15px 16px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);width:100%;margin:6px 0;cursor:pointer;transition:transform .12s,filter .12s}
button:active{transform:scale(.98);filter:brightness(1.15)}
button.b{background:linear-gradient(135deg,var(--ac2),var(--ac) 45%,var(--acd));color:#1a1204;border:0;font-weight:800;box-shadow:0 8px 24px rgba(224,180,90,.28)}
button.red{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;border:0}
button.gr{background:linear-gradient(135deg,#34d399,#059669);color:#04130c;border:0;font-weight:850;font-size:19px;padding:22px;box-shadow:0 10px 28px rgba(16,185,129,.3)}
button.g{background:transparent}button:disabled{opacity:.4}
button.dz{background:transparent;color:var(--rd);border-color:rgba(248,113,113,.3)}
.bk{width:auto;padding:9px 14px;margin:0 0 6px;border-radius:999px;font-size:14px}
.run{background:linear-gradient(145deg,#10b981,#047857);color:#fff;border-radius:26px;padding:20px;margin:12px 0;text-align:center;box-shadow:0 14px 36px rgba(16,185,129,.28)}
.run h2{font-size:24px}
.run .big{font-size:42px;font-weight:800;margin:6px 0 10px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.run button{background:rgba(255,255,255,.2);color:#fff;border:0}.run button.red{background:linear-gradient(135deg,#f87171,#dc2626)}
.warn{background:var(--or);color:#000;border-radius:12px;padding:10px;margin:8px 0;display:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;font-size:14px;margin:0}
.tile i{font-style:normal;font-size:24px;width:48px;height:48px;border-radius:16px;background:rgba(224,180,90,.13);display:flex;align-items:center;justify-content:center}
.todo{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--bd);margin:8px 0 0;cursor:pointer}
.todo.warn{display:flex;background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.35);color:var(--tx)}
.todo i{font-style:normal;font-size:22px}.todo b{display:block}
.banner{border-radius:18px;padding:14px 16px;margin:8px 0;font-weight:750}
.banner small{font-weight:500;margin-top:2px;color:inherit;opacity:.85}
.banner.warn{display:block;background:rgba(251,191,36,.14);color:#fcd34d;border:1px solid rgba(251,191,36,.4);border-radius:18px;padding:14px 16px}
.banner.ok{background:rgba(52,211,153,.13);color:#6ee7b7;border:1px solid rgba(52,211,153,.35)}
.bigtotal{font-size:40px;font-weight:850;letter-spacing:-.02em;color:var(--ac2);margin:2px 0}
input,textarea,select{font:inherit;width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--bg2);color:var(--tx);margin:6px 0}
input:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(224,180,90,.2)}
textarea{min-height:90px}
label{font-size:13px}
nav{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:rgba(22,22,30,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:28px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.6);z-index:10}
nav button{border:0;background:none;margin:0;padding:8px 2px;font-size:11px;font-weight:600;color:var(--mu);border-radius:22px;flex:1}
nav button.on{background:rgba(224,180,90,.15);color:var(--ac2)}nav button i{display:block;font-style:normal;font-size:21px;margin-bottom:1px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.md{background:var(--card);border:1px solid var(--bd);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.r{display:flex;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}.chips button{width:auto;white-space:nowrap;padding:9px 15px;border-radius:999px;font-size:14px;margin:0}.chips .on{background:linear-gradient(135deg,var(--ac2),var(--ac));color:#1a1204;border:0;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid div{padding:6px 0;border-radius:12px;font-size:13px;min-height:46px;cursor:pointer}
.grid .h{min-height:0;color:var(--mu);cursor:default}.grid .w{background:rgba(224,180,90,.14)}.grid .s{outline:2px solid var(--ac)}
.grid b{display:block;font-size:10.5px;color:var(--ac2)}
img.ph{width:100%;border-radius:16px;margin:6px 0}
.tag{display:inline-block;background:rgba(251,191,36,.16);color:#fcd34d;border-radius:8px;padding:2px 8px;font-size:12px}
img.th{width:84px;height:84px;object-fit:cover;border-radius:14px;margin:6px 6px 0 0;background:var(--bd);cursor:pointer}
.zm{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zm img{max-width:100%;max-height:75vh}
.tw{display:inline-block;width:96px;vertical-align:top;margin:0 8px 0 0}
.tw img.th{width:96px;height:96px;margin:6px 0 0}
.cp{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
a{color:var(--ac2);font-weight:650;text-underline-offset:3px}
a[href^="tel"]{color:#fff;font-weight:800}
#toast{width:max-content;max-width:88vw;text-align:center;position:fixed;left:50%;transform:translateX(-50%);bottom:112px;background:#f4f4f6;color:#111;font-weight:650;padding:11px 18px;border-radius:14px;z-index:60;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goalcard{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:14px}
.goalbar{height:9px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:8px}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acd),var(--ac2));border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.kpi{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:13px}
.kpi b{font-size:22px;display:block;margin-top:3px;color:var(--ac2);letter-spacing:-.01em}
.mini{font-size:12px;color:var(--mu)}
.status{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:750}
.status.paid{background:rgba(52,211,153,.15);color:#6ee7b7}
.status.ok{background:rgba(52,211,153,.15);color:#6ee7b7}
.status.due,.status.warn{display:inline-block;background:rgba(251,191,36,.16);color:#fcd34d;border-radius:999px;padding:3px 9px;margin:0}
.status.none{background:rgba(255,255,255,.08);color:var(--mu)}
.invgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logo{display:block;width:100%;max-width:260px;height:auto;margin:0 auto 14px;border-radius:12px}
.invline{display:grid;grid-template-columns:1fr 66px 84px 40px;gap:6px;align-items:center;margin:5px 0}
.invline input{margin:0;padding:11px 8px}
.invline button{margin:0;padding:0;height:44px;width:40px;border-radius:12px}
.invoice-total{font-size:20px;font-weight:800;text-align:right;padding-top:10px;border-top:1px solid var(--bd);margin-top:10px}
details.c summary{cursor:pointer;font-weight:750;list-style:none}details.c summary::-webkit-details-marker{display:none}
details.c[open] summary{margin-bottom:10px}
@media(max-width:380px){.goalgrid,.kpis{grid-template-columns:1fr}.invgrid{grid-template-columns:1fr}}

function companyInfo(){return db.settings.company||{}}
function invStatus(inv){const s=inv.status||'draft';return s=='due'?'sent':s}
function invStatusText(s){return s=='paid'?'PAYÉE':s=='sent'?'ENVOYÉE':'PAS ENCORE ENVOYÉE'}
function invStatusHtml(s){return s=='paid'?'<span class="status paid">💶 Payée</span>':s=='sent'?'<span class="status ok">✅ Envoyée</span>':'<span class="status warn">⚠️ Pas encore envoyée</span>'}
function setSent(inv){inv.sentAt=Date.now();if(inv.status!='paid')inv.status='sent';save()}
function unbilled(cid){const sI=invoicedSet();return db.sessions.filter(x=>cOf(x.siteId)==cid&&!sI.has(x.id)).sort((a,b)=>a.start-b.start)}
function linesFrom(ss){const g={};ss.forEach(x=>{const st=site(x.siteId)||{},fx=st.fixed>0,k=x.siteId+'|'+(fx?'fixe':rt(x));g[k]=g[k]||{st,fx,rate:rt(x),ms:0,m:0};g[k].ms+=dur(x);g[k].m+=mon(x,dur(x))});

for(let d=1;d<=n;d++){const t=new Date(y,m,d).getTime(),a=agg(t,dd(t,1)).tot;g+=`<div data-a=day data-i="${t}" class="${a?'w ':''}${t==cal.sel?'s':''}">${d}${a?`<b>${hm(a)}</b>`:''}</div>`}
const ms=agg(new Date(y,m,1).getTime(),new Date(y,m+1,1).getTime()),k=(new Date(cal.sel).getDay()+6)%7,wk=agg(dd(cal.sel,-k),dd(cal.sel,7-k)),dy=agg(cal.sel,dd(cal.sel,1));
return `<h1>📅 Calendrier</h1><div class=r><button data-a=pm data-i=-1>◀</button><button class=g data-a=today>${new Date(y,m,1).toLocaleDateString('fr-BE',{month:'long',year:'numeric'})}</button><button data-a=pm data-i=1>▶</button></div><div class=c><div class=grid>${g}</div></div>
<div class=c><small>Total du mois</small><b>${hm(ms.tot)}</b> · <small style="display:inline">Semaine : ${hm(wk.tot)}</small></div>
<h3>${D(cal.sel)}</h3>${Object.entries(dy.m).map(([id,v])=>`<div class="c row" data-a=site data-i="${id}"><b>${esc(lab(id))}</b><span>${hm(v)}</span></div>`).join('')||'<p class=m>Rien de travaillé ce jour-là.</p>'}${dy.tot?`<p><b>Total : ${hm(dy.tot)}</b></p>`:''}`}
function range(p=P){const n=Date.now(),d=new Date(n),Y=d.getFullYear(),M=d.getMonth();if(p=='all')return[0,4e12];
if(p=='today')return[dd(n),dd(n,1)];if(p=='week'){const k=(d.getDay()+6)%7;return[dd(n,-k),dd(n,7-k)]}
if(p=='month')return[new Date(Y,M,1).getTime(),new Date(Y,M+1,1).getTime()];if(p=='year')return[new Date(Y,0,1).getTime(),new Date(Y+1,0,1).getTime()];
return[dd(new Date(C.a+'T00:00').getTime()),dd(new Date(C.b+'T00:00').getTime(),1)]}
function statV(){const L={today:'Aujourd’hui',week:'Cette semaine',month:'Ce mois',year:'Cette année',all:'Tout',custom:'Période personnalisée'},[a,b]=range(),r=agg(a,b);
return `<h1>📊 Statistiques</h1><div class=chips>${Object.keys(L).map(k=>`<button class="${P==k?'on':''}" data-a=per data-i=${k}>${L[k]}</button>`).join('')}</div>
${P=='custom'?`<div class=r><input type=date id=ca value="${C.a}"><input type=date id=cb value="${C.b}"></div>`:''}
<div class=c><small>📊 ${L[P].toUpperCase()}</small><small>Temps total</small><h1>${hm(r.tot)}</h1><small>Jours travaillés : ${r.days} · Chantiers : ${Object.keys(r.m).length}</small>${gain(r.money)||'<small>💶 Définis un tarif horaire dans tes chantiers pour voir tes gains</small>'}</div>
${byClient(r)}<div class=c><small>💳 PAIEMENTS</small><div class=kpis>
<div class=kpi><small>À payer</small><b>${eur(db.sessions.filter(s=>{const o=ov(s,a,b);return o>0&&s.billing!='paid'}).reduce((x,s)=>x+mon(s,ov(s,a,b)),0))}</b></div>
<div class=kpi><small>Payé</small><b>${eur(db.sessions.filter(s=>{const o=ov(s,a,b);return o>0&&s.billing=='paid'}).reduce((x,s)=>x+mon(s,ov(s,a,b)),0))}</b></div>
</div></div>${r.tot?`<p><b>Total : ${hm(r.tot)}</b></p>`:''}${goalsCard()}${backupCard()}`}
function render(){const v=V.t;const h={home,sites,inv:invList,invoice:invoiceV,site:siteV,ses:sesV,cal:calV,stat:statV,client:clientV}[v]();
$('#app').innerHTML=TOP+(['site','ses','client','invoice'].includes(v)?'<button class="bk" data-a=back>← Retour</button>':'')+h;
const root=['site','ses','client','invoice'].includes(v)?(H[0]||{t:'home'}).t:v;$('#nav').innerHTML=TABS.map(t=>`<button data-a=tab data-i=${t[0]} class="${root==t[0]?'on':''}"><i>${t[1]}</i>${t[2]}</button>`).join('');fill();tick()}
async function fill(){for(const e of document.querySelectorAll('img[data-pid]')){const p=await getP(e.dataset.pid);if(p){e.src=p.d;const cc=document.querySelector(`small[data-cap="${e.dataset.pid}"]`);if(cc)cc.textContent=p.c||'';const s=document.querySelector(`small[data-ts="${e.dataset.pid}"]`);if(s)s.textContent='Prise le '+D(p.ts)+' à '+T(p.ts)}}}
function tick(){const a=db.active,l=$('#live');if(!a||!l)return;const e=Date.now()-a.start;l.textContent=hms(wkA(a));const lp=$('#lpause');if(lp)lp.textContent=hms(pauseNow(a));
if(e>8*36e5){const w=$('#warn');w.style.display='block';w.textContent=`⚠️ Le compteur ${site(a.siteId).name} est actif depuis ${hm(e)}.`;
if(!a.n){a.n=1;save();try{Notification.permission=='granted'&&new Notification('Suivi chantiers',{body:w.textContent})}catch(x){}}}}
setInterval(tick,1000);document.addEventListener('visibilitychange',tick);

document.addEventListener('input',e=>{if(V.t=='invoice'&&(e.target.dataset.invline!==undefined||/^inv(due|at|note|payment|legal)$/.test(e.target.id))){const inv=invoices().find(x=>x.id==V.i);if(inv){syncInv(inv);const t=$('#invtot');if(t)t.innerHTML=invTotHtml(inv);const bg=$('#invbig');if(bg)bg.textContent=eur(invGrand(inv))}}
if(e.target.id=='q'){Q=e.target.value;if(V.t=='sites'){const l=$('#list');if(l)l.innerHTML=sList()}else if(V.t=='inv'){const l=$('#ilist');if(l)l.innerHTML=invRows()}}if(e.target.id=='sd'){SD=e.target.value;const x=$('#sres');if(x)x.innerHTML=sRes(site(V.i));fill()}if(e.target.id=='ca'||e.target.id=='cb'){C.a=$('#ca').value||C.a;C.b=$('#cb').value||C.b;render()}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i;
if(a=='tab'){V={t:i};H=[];Q='';INF='all';render()}

else if(a=='invoice'){H.push(V);V={t:'invoice',i};render()}
else if(a=='invnew'){if(!db.clients.length)return toast('Crée d’abord un dossier');const ci=await pickOne('Facture pour quel dossier ?',db.clients.map(c=>c.name));if(ci===null)return;const cid=db.clients[ci].id,un=unbilled(cid),inv=un.length?makeInvoice(cid,un):makeInvoice(cid);if(!un.length)toast('Aucune heure à facturer : facture vide');H.push(V);V={t:'invoice',i:inv.id};render()}
else if(a=='invfrom'){const c=client(i);if(!c)return;const un=unbilled(c.id),inv=un.length?makeInvoice(c.id,un):makeInvoice(c.id);if(!un.length)toast('Aucune heure à facturer : facture vide');H.push(V);V={t:'invoice',i:inv.id};render()}
else if(a=='ifilt'){INF=i;render()}
else if(a=='invsent'){const inv=invoices().find(x=>x.id==V.i);if(inv){setSent(inv);render()}}
else if(a=='invpaid'){const inv=invoices().find(x=>x.id==V.i);if(!inv)return;syncInv(inv);const was=invStatus(inv)=='paid';inv.status=was?(inv.sentAt?'sent':'draft'):'paid';(inv.sessionIds||[]).forEach(id=>{const x=ses(id);if(x)x.billing=was?'due':'paid'});save();render()}
else if(a=='delline'){const inv=invoices().find(x=>x.id==V.i);if(inv){syncInv(inv);inv.lines.splice(+i,1);save();render()}}
else if(a=='company'){const o=companyInfo(),r=await ask('Mes infos de facturation',{msg:'Vérifie les mentions obligatoires (numéro d’entreprise, TVA…). Ceci ne remplace pas un conseil juridique.',fields:[{label:'Nom / entreprise',val:o.name},{label:'Adresse',val:o.adr},{label:'Téléphone',type:'tel',val:o.tel},{label:'E-mail',type:'email',val:o.mail},{label:'N° TVA (facultatif)',val:o.vat},{label:'IBAN (facultatif)',val:o.iban}],ok:'Enregistrer'});if(r){o.name=r[0].trim();o.adr=r[1].trim();o.tel=r[2].trim();o.mail=r[3].trim();o.vat=r[4].trim();o.iban=r[5].trim();save();render()}}
else if(a=='addline'){const inv=invoices().find(x=>x.id==V.i);inv.lines.push({desc:'Nouvelle prestation',qty:1,price:0});save();render()}
else if(a=='invsave'){const inv=invoices().find(x=>x.id==V.i);if(!inv)return;syncInv(inv);toast('Facture enregistrée ✅');render()}
else if(a=='invprint'){const inv=invoices().find(x=>x.id==V.i);if(inv){syncInv(inv);printInvoice(inv)}}
else if(a=='invemail'){const inv=invoices().find(x=>x.id==V.i);if(inv){syncInv(inv);emailInvoice(inv)}}
else if(a=='invwa'){const inv=invoices().find(x=>x.id==V.i);if(inv){syncInv(inv);shareInvoice(inv)}}
else if(a=='invpdfshare'){const inv=invoices().find(x=>x.id==V.i);if(inv){syncInv(inv);await sharePdf(inv)}}
else if(a=='invpdf'){const inv=invoices().find(x=>x.id==V.i);if(inv){syncInv(inv);const f=new File([makePDF(inv)],inv.number+'.pdf',{type:'application/pdf'}),u=URL.createObjectURL(f),w=window.open(u,'_blank');if(!w)savePdf(f)}}
else if(a=='invcopy'){const inv=invoices().find(x=>x.id==V.i);if(inv){syncInv(inv);try{await navigator.clipboard.writeText(invoiceText(inv));toast('Texte copié ✅')}catch(e){toast('Copie impossible')}}}
else if(a=='invstatus'){const inv=invoices().find(x=>x.id==V.i);if(!inv)return;syncInv(inv);const L=['draft','sent','due','paid'],k=await pickOne('Statut de la facture',['Brouillon','Envoyé','À payer','Payé'],'Actuel : '+invStatusText(invStatus(inv)));if(k===null)return;inv.status=L[k];(inv.sessionIds||[]).forEach(id=>{const x=ses(id);if(x)x.billing=L[k]=='paid'?'paid':'due'});save();render()}
else if(a=='invdel'){const inv=invoices().find(x=>x.id==V.i);if(!inv)return;if(await ask('Supprimer cette facture ?',{ok:'Supprimer',red:1})){db.invoices=db.invoices.filter(x=>x.id!=inv.id);save();V=H.pop()||{t:'inv'};render()}}

else if(a=='site'||a=='ses'||a=='client'){if(a=='site')SD='';H.push(V);V={t:a,i};render()}
else if(a=='back'){V=H.pop()||{t:'home'};render()}
else if(a=='newclient'){const r=await ask('Nouveau dossier',{msg:'Une entreprise, un client…',fields:[{label:'Nom du dossier'},{label:'Adresse (facultatif)'},{label:'Téléphone (facultatif)',type:'tel'},{label:'E-mail (facultatif)',type:'email'}],ok:'Créer'});if(r&&r[0].trim()){const c={id:uid(),name:r[0].trim(),adr:r[1].trim(),tel:r[2].trim(),mail:r[3].trim()};db.clients.push(c);save();H.push(V);V={t:'client',i:c.id};render()}}
else if(a=='newsite'){const r=await ask('Nouveau chantier',{fields:[{label:'Nom du chantier'},{label:'Adresse (facultatif)'},{label:'Tarif par heure en € (facultatif)',type:'number'},{label:'OU prix fixe en € (facultatif)',type:'number'}],ok:'Créer'});if(r&&r[0].trim()){const x=parseFloat(String(r[2]).replace(',','.')),y=parseFloat(String(r[3]).replace(',','.')),n={id:uid(),clientId:V.i,name:r[0].trim(),adr:r[1].trim(),notes:[],rate:x>0?x:null,fixed:y>0?y:null};db.sites.push(n);save();H.push(V);V={t:'site',i:n.id};render()}}
else if(a=='cup'){V={t:'client',i};H=[{t:'sites'}];render()}
else if(a=='cper'){CP=i;render()}
else if(a=='cinfo'||a=='sinfo'){const o=a=='cinfo'?client(V.i):site(V.i),r=await ask(a=='cinfo'?'Infos du dossier':'Infos du chantier',{msg:a=='sinfo'?'Vide = on utilise les infos du dossier.':'',fields:[{label:'Adresse',val:o.adr},{label:'Téléphone',type:'tel',val:o.tel},{label:'E-mail',type:'email',val:o.mail}]});if(r){o.adr=r[0].trim();o.tel=r[1].trim();o.mail=r[2].trim();save();render()}}
else if(a=='renc'){const c=client(V.i),r=await ask('Renommer le dossier',{fields:[{label:'Nom',val:c.name}]});if(r&&r[0].trim()){c.name=r[0].trim();save();render()}}
else if(a=='delc'){const c=client(V.i),ss=db.sites.filter(x=>x.clientId==c.id);if(db.active&&ss.some(x=>x.id==db.active.siteId))return toast('Terminez d’abord le compteur');const n=db.sessions.filter(x=>ss.some(y=>y.id==x.siteId)).length;if(await ask('Supprimer ce dossier ?',{msg:`« ${esc(c.name)} », ses ${ss.length} chantier(s) et ses ${n} session(s) seront supprimés définitivement.`,ok:'Supprimer',red:1})){db.sessions=db.sessions.filter(x=>!ss.some(y=>y.id==x.siteId));db.sites=db.sites.filter(x=>x.clientId!=c.id);db.clients=db.clients.filter(x=>x.id!=c.id);save();V=H.pop()||{t:'sites'};render()}}

else if(a=='goals'){const r=await ask('Mes objectifs',{msg:'Les objectifs servent uniquement au tableau de bord.',fields:[{label:'Objectif heures / semaine',type:'number',val:db.settings.hourGoal},{label:'Objectif € / mois',type:'number',val:db.settings.moneyGoal}],ok:'Enregistrer'});if(r){const h=parseFloat(String(r[0]).replace(',','.')),m=parseFloat(String(r[1]).replace(',','.'));db.settings.hourGoal=h>0?h:0;db.settings.moneyGoal=m>0?m:0;save();render()}}
else if(a=='export'){exportData()}
else if(a=='import'){await importData()}
else if(a=='bill'){const x=ses(V.i);x.billing=x.billing=='paid'?'due':'paid';save();render()}

else if(a=='srate'){const x=ses(V.i),r=await ask('Tarif de cette session',{msg:'Vide = tarif du chantier.',fields:[{label:'Montant par heure (€)',type:'number',val:x.rate!=null?x.rate:''}]});if(r){const n=parseFloat(String(r[0]).replace(',','.'));x.rate=n>=0?n:null;save();render()}}
else if(a=='start'||a=='resume'){const sid=a=='start'?V.i:i;if(db.active)return toast('Un compteur est déjà actif');db.active={siteId:sid,start:Date.now(),ps:null};save();try{Notification.requestPermission()}catch(x){}render();const p=await takePhoto();if(p&&db.active){db.active.ps=p;save();render()}}
else if(a=='pause'){if(db.active&&!db.active.pausedAt){db.active.pausedAt=Date.now();save();render()}}
else if(a=='unpause'){const x=db.active;if(x&&x.pausedAt){(x.pauses=x.pauses||[]).push({a:x.pausedAt,b:Date.now()});x.pausedAt=null;save();render()}}
else if(a=='pstart'){const p=await takePhoto();if(p&&db.active){db.active.ps=p;save();render()}}
else if(a=='stop'){const x=db.active;const ok=await ask('Terminer le travail ?',{msg:'Travail : <b id=lv></b>'+(pauseNow(x)>0?'<br>Pause : '+hms(pauseNow(x)):'')+'<br>Une photo de fin va t’être proposée.',live:()=>hms(wkA(x)),ok:'Terminer'});if(!ok)return;const end=Date.now();
const pe=await takePhoto();db.sessions.push({id:uid(),siteId:x.siteId,start:x.start,end,note:'',ps:x.ps,pe,edited:false,pauses:(x.pauses||[]).concat(x.pausedAt?[{a:x.pausedAt,b:end}]:[]),rate:(site(x.siteId)||{}).rate||null,billing:'none'});db.active=null;save();render();toast('Session enregistrée ✅')}
else if(a=='ren'){const s=site(V.i),r=await ask('Renommer',{fields:[{label:'Nom',val:s.name}]});if(r&&r[0].trim()){s.name=r[0].trim();save();render()}}
else if(a=='delsite'){const s=site(V.i);if(db.active&&db.active.siteId==s.id)return toast('Terminez d’abord le compteur');const n=db.sessions.filter(x=>x.siteId==s.id).length;if(await ask('Supprimer ce chantier ?',{msg:`« ${esc(s.name)} » et ses ${n} session(s) seront supprimés définitivement.`,ok:'Supprimer',red:1})){db.sessions=db.sessions.filter(x=>x.siteId!=s.id);db.sites=db.sites.filter(x=>x.id!=s.id);save();V=H.pop()||{t:'sites'};render()}}
else if(a=='nadd'){const r=await ask('Nouvelle note',{fields:[{area:1}],ok:'Ajouter'});if(r&&r[0].trim()){(site(V.i).notes=site(V.i).notes||[]).push({id:uid(),t:r[0].trim()});save();render()}}
else if(a=='nedit'){const n=site(V.i).notes.find(x=>x.id==i),r=await ask('Modifier la note',{fields:[{area:1,val:n.t}]});if(r&&r[0].trim()){n.t=r[0].trim();save();render()}}
else if(a=='ndel'){if(await ask('Supprimer la note ?',{ok:'Supprimer',red:1})){const s=site(V.i);s.notes=s.notes.filter(x=>x.id!=i);save();render()}}
else if(a=='snote'){const s=ses(V.i),r=await ask('Note de la session',{fields:[{area:1,val:s.note}]});if(r){s.note=r[0];save();render()}}
else if(a=='sedit'){const s=ses(V.i),r=await ask('Modifier la session',{msg:'L’original sera conservé.',fields:[{label:'Début',type:'datetime-local',val:loc(s.start)},{label:'Fin',type:'datetime-local',val:loc(s.end)},{label:'Pause (minutes)',type:'number',val:Math.round(pt(s)/60000)}]});
if(r){const st=new Date(r[0]).getTime(),en=new Date(r[1]).getTime();if(!(st&&en)||en<=st)return toast('La fin doit être après le début');const pm=Math.max(0,parseFloat(String(r[2]).replace(',','.'))||0);if(pm*60000>=en-st)return toast('La pause est plus longue que la session');if(!s.edited){s.orig={start:s.start,end:s.end};s.edited=true}if(Math.round(pm)!=Math.round(pt(s)/60000))s.pauses=pm>0?[{a:st,b:st+pm*60000}]:[];s.start=st;s.end=en;save();render()}}
else if(a=='sdel'){if(await ask('Supprimer cette session ?',{ok:'Supprimer',red:1})){db.sessions=db.sessions.filter(x=>x.id!=V.i);save();V=H.pop()||{t:'home'};render()}}
else if(a=='pm'){cal.m+=+i;if(cal.m>11){cal.m=0;cal.y++}if(cal.m<0){cal.m=11;cal.y--}render()}
else if(a=='today'){const n=new Date();cal={y:n.getFullYear(),m:n.getMonth(),sel:dd(n)};render()}
else if(a=='day'){cal.sel=+i;render()}
else if(a=='per'){P=i;render()}
else if(a=='sper'){SP=i;render()}
else if(a=='nphoto'){const ids=await pickMany();if(ids.length){await captionPhotos(ids);const n=site(V.i).notes.find(x=>x.id==i);n.ph=(n.ph||[]).concat(ids);save();render()}}
else if(a=='sphoto'){const ids=await pickMany();if(ids.length){await captionPhotos(ids);const x=ses(V.i);x.nph=(x.nph||[]).concat(ids);save();render()}}
else if(a=='zoom'){const p=await getP(i);if(!p)return;const z=document.createElement('div');z.className='zm';z.innerHTML=`<img src="${p.d}" data-a=zclose><div id=zcap style="color:#fff;padding:10px 16px;text-align:center">${esc(p.c)}</div><div class=r style="max-width:420px;width:100%;padding:12px"><button data-a=pcap data-i="${i}">📝 Note</button><button data-a=zclose>Fermer</button>${el.dataset.o?`<button class=red data-a=delph data-i="${i}" data-o="${el.dataset.o}">🗑 Retirer</button>`:''}</div>`;document.body.append(z)}
else if(a=='pcap'){const p=await getP(i);if(!p)return;const r=await ask('Note de la photo',{fields:[{area:1,val:p.c||''}]});if(r){p.c=r[0].trim();await putP(i,p);const e=document.querySelector('#zcap');if(e)e.textContent=p.c;fill()}}
else if(a=='sdclr'){SD='';render()}
else if(a=='zclose'){const z=document.querySelector('.zm');z&&z.remove()}
else if(a=='delph'){if(await ask('Retirer cette photo ?',{ok:'Retirer',red:1})){const[k,id]=el.dataset.o.split(':'),o=k=='n'?site(V.i).notes.find(x=>x.id==id):ses(V.i),key=k=='n'?'ph':'nph';o[key]=(o[key]||[]).filter(x=>x!=i);save();const z=document.querySelector('.zm');z&&z.remove();render()}}
else if(a=='rate'){const s=site(V.i),r=await ask('Tarif du chantier',{msg:'Au choix : un tarif par heure, ou un prix fixe pour tout le chantier. Le prix fixe remplace le tarif par heure. Les heures restent toujours comptées.',fields:[{label:'Tarif par heure (€)',type:'number',val:s.rate||''},{label:'OU prix fixe du chantier (€)',type:'number',val:s.fixed||''}]});if(r){const n=v=>{const x=parseFloat(String(v).replace(',','.'));return x>0?x:null};s.rate=n(r[0]);s.fixed=n(r[1]);save();render()}}});
render();
</script></body></html>
