<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chantiers">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi chantiers</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mu:#6b7280;--ac:#2563eb;--gr:#16a34a;--rd:#dc2626;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1218;--card:#1a1f29;--tx:#f1f3f6;--mu:#9aa3b2;--bd:#2a3140}}
:root[data-theme=dark]{--bg:#0f1218;--card:#1a1f29;--tx:#f1f3f6;--mu:#9aa3b2;--bd:#2a3140}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:100px}
#app{padding:16px;max-width:560px;margin:auto}
h1{margin:8px 0 4px;font-size:28px}h2{margin:4px 0}h3{margin:16px 0 8px}
small{display:block;color:var(--mu);font-size:13px}.m{color:var(--mu)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.row>span{font-weight:700;white-space:nowrap}
button{font:inherit;border:0;border-radius:14px;padding:14px 16px;background:var(--card);color:var(--tx);border:1px solid var(--bd);width:100%;margin:6px 0;cursor:pointer}
button.b{background:var(--ac);color:#fff;border:0;font-weight:700}
button.red{background:var(--rd);color:#fff;border:0}
button.gr{background:var(--gr);color:#fff;border:0;font-weight:800;font-size:18px;padding:20px}
button.g{background:transparent}button:disabled{opacity:.4}
.bk{width:auto;padding:8px 12px;margin:0 0 8px}
.run{background:var(--gr);color:#fff;border-radius:20px;padding:18px;margin:12px 0;text-align:center}
.run .big{font-size:34px;font-weight:800;margin:8px 0;font-variant-numeric:tabular-nums}
.run button{background:rgba(255,255,255,.2);color:#fff;border:0}.run button.red{background:var(--rd)}
.warn{background:#f59e0b;color:#000;border-radius:12px;padding:10px;margin:8px 0;display:none}
.big3 button{text-align:left;font-size:18px;padding:20px}
input,textarea,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:6px 0}
textarea{min-height:90px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;margin:0;padding:8px 2px;font-size:12px;color:var(--mu)}
nav button.on{color:var(--ac);font-weight:700}nav button i{display:block;font-style:normal;font-size:22px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.md{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.r{display:flex;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.chips button{width:auto;white-space:nowrap;padding:8px 12px}.chips .on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid div{padding:6px 0;border-radius:10px;font-size:13px;min-height:44px;cursor:pointer}
.grid .h{min-height:0;color:var(--mu);cursor:default}.grid .w{background:rgba(37,99,235,.15)}.grid .s{outline:2px solid var(--ac)}
.grid b{display:block;font-size:11px;color:var(--ac)}
img.ph{width:100%;border-radius:12px;margin:6px 0}
.tag{display:inline-block;background:#f59e0b;color:#000;border-radius:8px;padding:2px 8px;font-size:12px}
img.th{width:84px;height:84px;object-fit:cover;border-radius:10px;margin:6px 6px 0 0;background:var(--bd);cursor:pointer}
.zm{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zm img{max-width:100%;max-height:75vh}
.tw{display:inline-block;width:96px;vertical-align:top;margin:0 8px 0 0}
.tw img.th{width:96px;height:96px;margin:6px 0 0}
.cp{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
a{color:var(--ac)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;display:none}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db=null;try{db=JSON.parse(localStorage.getItem('hc')||'null')}catch(e){}
db=db||{sites:[],sessions:[],active:null};
const save=()=>{try{localStorage.setItem('hc',JSON.stringify(db))}catch(e){toast('Stockage plein !')}};
db.clients=db.clients||[];db.sites.forEach(x=>{if(!x.clientId){const c={id:uid(),name:x.name};db.clients.push(c);x.clientId=c.id}});save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let idb;try{const o=indexedDB.open('hcp',1);o.onupgradeneeded=()=>o.result.createObjectStore('p');o.onsuccess=()=>{idb=o.result;fill()}}catch(e){}
const putP=(id,v)=>new Promise(r=>{try{const t=idb.transaction('p','readwrite');t.objectStore('p').put(v,id);t.oncomplete=r;t.onerror=r}catch(e){r()}});
const getP=id=>new Promise(r=>{try{const q=idb.transaction('p').objectStore('p').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
const hm=ms=>{if(ms<36e5){const s=Math.floor(ms/1e3);return Math.floor(s/60)+'min'+pad(s%60)+'s'}const m=Math.round(ms/6e4);return Math.floor(m/60)+'h'+pad(m%60)};
const hms=ms=>{const s=Math.max(0,Math.floor(ms/1e3));return pad(Math.floor(s/3600))+'h'+pad(Math.floor(s%3600/60))+'min'+pad(s%60)+'s'};
const T=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const Ts=t=>T(t)+':'+pad(new Date(t).getSeconds());
const D=t=>new Date(t).toLocaleDateString('fr-BE',{day:'numeric',month:'long',year:'numeric'});
const dd=(t,n=0)=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n).getTime()};
const loc=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const iso=t=>loc(t).slice(0,10);
const dur=s=>s.end-s.start,site=id=>db.sites.find(s=>s.id==id),ses=id=>db.sessions.find(s=>s.id==id);
const ov=(s,a,b)=>Math.max(0,Math.min(s.end,b)-Math.max(s.start,a));
const tot=id=>db.sessions.filter(s=>s.siteId==id).reduce((a,s)=>a+dur(s),0);
const eur=x=>x.toLocaleString('fr-BE',{style:'currency',currency:'EUR'});
const rate=id=>(site(id)&&site(id).rate)||0;
const gain=x=>x?`<h2>💶 ${eur(x)}</h2>`:'';
function siteAgg(id,a,b){let ms=0,money=0;const days=new Set();db.sessions.forEach(s=>{if(s.siteId==id&&ov(s,a,b)>0){ms+=ov(s,a,b);money+=ov(s,a,b)/36e5*rt(s);for(let t=dd(Math.max(s.start,a));t<Math.min(s.end,b);t=dd(t,1))days.add(t)}});return{ms,money,days:days.size}}
function siteStats(s){const L={today:'Aujourd’hui',week:'Semaine',month:'Mois',year:'Année',all:'Tout'},[a,b]=range(SP),v=siteAgg(s.id,a,b);
return `<div class=chips>${Object.keys(L).map(k=>`<button class="${SP==k?'on':''}" data-a=sper data-i=${k}>${L[k]}</button>`).join('')}</div><div class=c><small>📊 ${L[SP].toUpperCase()}</small><h1>${hm(v.ms)}</h1><small>Jours travaillés : ${v.days}</small>${s.rate||v.money?`<h2>💶 ${eur(v.money)}</h2>`:'<small>Définis un tarif horaire pour voir tes gains</small>'}</div><button data-a=rate>💶 ${s.rate?'Modifier':'Définir'} le tarif horaire${s.rate?' ('+eur(s.rate)+'/h)':''}</button>`}
const client=id=>db.clients.find(c=>c.id==id),cOf=id=>(site(id)||{}).clientId;
const rt=x=>x.rate!=null?x.rate:((site(x.siteId)||{}).rate||0);
const lab=id=>((client(cOf(id))||{}).name||'')+' › '+((site(id)||{}).name||'');
const lk=(i,v)=>!v?'':i=='a'?`<div>📍 <a href="https://maps.apple.com/?q=${encodeURIComponent(v)}" target=_blank rel=noopener>${esc(v)}</a></div>`:i=='t'?`<div>📞 <a href="tel:${esc(v)}">${esc(v)}</a></div>`:`<div>✉️ <a href="mailto:${esc(v)}">${esc(v)}</a></div>`;
const info=(o,fb)=>{const g=k=>o[k]||(fb&&fb[k])||'',h=lk('a',g('adr'))+lk('t',g('tel'))+lk('m',g('mail'));return h||'<span class=m>Aucune info renseignée</span>'};
function agg(a,b,f){const m={},e={},days=new Set();db.sessions.forEach(s=>{if(f&&!f(s))return;const o=ov(s,a,b);if(o>0){m[s.siteId]=(m[s.siteId]||0)+o;e[s.siteId]=(e[s.siteId]||0)+o/36e5*rt(s);for(let t=dd(Math.max(s.start,a));t<Math.min(s.end,b);t=dd(t,1))days.add(t)}});const sum=x=>Object.values(x).reduce((p,q)=>p+q,0);return{m,e,days:days.size,tot:sum(m),money:sum(e)}}
function ask(title,o={}){return new Promise(r=>{const m=document.createElement('div');m.className='mo';
const f=(o.fields||[]).map((x,i)=>`<label class=m>${x.label||''}</label>`+(x.area?`<textarea id=f${i}>${esc(x.val)}</textarea>`:`<input id=f${i} type="${x.type||'text'}" ${x.type=='number'?'step=any inputmode=decimal':''} value="${esc(x.val)}">`)).join('');
m.innerHTML=`<div class=md><h3>${title}</h3>${o.msg?`<p class=m>${o.msg}</p>`:''}${f}<div class=r><button class=g id=mc>${o.no||'Annuler'}</button><button class="b ${o.red?'red':''}" id=mk>${o.ok||'OK'}</button></div></div>`;
document.body.append(m);let iv;if(o.live){const u=()=>{const e=m.querySelector('#lv');if(e)e.textContent=o.live()};u();iv=setInterval(u,1000)}const first=m.querySelector('#f0');first&&first.focus();
m.querySelector('#mc').onclick=()=>{clearInterval(iv);m.remove();r(null)};
m.querySelector('#mk').onclick=()=>{const v=(o.fields||[]).map((x,i)=>m.querySelector('#f'+i).value);clearInterval(iv);m.remove();r(o.fields?v:true)}})}
function pick(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.setAttribute('capture','environment');
i.onchange=()=>{const f=i.files[0];if(!f)return res(null);const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({d:c.toDataURL('image/jpeg',.7),ts:Date.now()})};im.onerror=()=>res(null);im.src=URL.createObjectURL(f)};
i.oncancel=()=>res(null);i.click()})}
function pickMany(){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;
i.onchange=async()=>{const out=[];for(const f of i.files){const p=await new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r({d:c.toDataURL('image/jpeg',.7),ts:Date.now()})};im.onerror=()=>r(null);im.src=URL.createObjectURL(f)});if(p){const id='p'+uid();await putP(id,p);out.push(id)}}res(out)};
i.oncancel=()=>res([]);i.click()})}
async function captionPhotos(ids){for(let k=0;k<ids.length;k++){const p=await getP(ids[k]);if(!p)continue;const r=await ask('Note de la photo'+(ids.length>1?` (${k+1}/${ids.length})`:''),{msg:`<img src="${p.d}" style="width:100%;max-height:35vh;object-fit:contain;border-radius:12px">`,fields:[{area:1}],ok:'Enregistrer',no:'Passer'});if(r&&r[0].trim()){p.c=r[0].trim();await putP(ids[k],p)}}}
const thumbs=(l,o)=>(l||[]).map(p=>`<span class=tw><img class=th data-pid="${p}" data-a=zoom data-i="${p}" data-o="${o}"><small class=cp data-cap="${p}"></small></span>`).join('');
async function takePhoto(){const p=await pick();if(!p)return null;const id='p'+uid();await putP(id,p);return id}

let V={t:'home'},H=[],Q='',P='week',SP='week',SD='',CP='week',C={a:iso(Date.now()),b:iso(Date.now())},cal={y:new Date().getFullYear(),m:new Date().getMonth(),sel:dd(Date.now())};
const TABS=[['home','🏠','Accueil'],['sites','📁','Dossiers'],['cal','📅','Calendrier'],['stat','📊','Stats']];

function runCard(full){const a=db.active;if(!a)return'';const s=site(a.siteId);
return `<div class=run><div>🟢 TRAVAIL EN COURS</div><h2>${esc(s.name)}</h2><div>${esc((client(s.clientId)||{}).name)}</div><div>Début : ${T(a.start)}</div><div class=big id=live>${hms(Date.now()-a.start)}</div><div class=warn id=warn></div>
${full?`<button class=red data-a=stop>⏹️ TERMINER LE TRAVAIL</button>`:`<button data-a=site data-i="${s.id}">Revenir au chantier</button>`}${!a.ps?`<button data-a=pstart>📸 Photo de début</button>`:''}</div>`}
function homeExtra(){const w=range('week'),v=agg(w[0],w[1]),l=[...db.sessions].sort((a,b)=>b.end-a.end)[0];
return (!db.active&&l&&site(l.siteId)?`<button class=gr data-a=resume data-i="${l.siteId}">▶️ Reprendre : ${esc(lab(l.siteId))}</button>`:'')+`<div class=c><small>CETTE SEMAINE</small><h2>${hm(v.tot)}${v.money?` · 💶 ${eur(v.money)}`:''}</h2></div>`}
function home(){return `<h1>Bienvenue 👋</h1><p class=m>Bon travail !</p>${runCard(false)}${homeExtra()}
<div class=big3><button data-a=tab data-i=sites>📁 Mes dossiers</button><button data-a=tab data-i=cal>📅 Calendrier</button><button data-a=tab data-i=stat>📊 Temps travaillé / Statistiques</button></div>`}
function sList(){const q=Q.toLowerCase();return db.clients.filter(c=>c.name.toLowerCase().includes(q)||db.sites.some(s=>s.clientId==c.id&&s.name.toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{const n=db.sites.filter(s=>s.clientId==c.id).length,t=db.sessions.filter(x=>cOf(x.siteId)==c.id).reduce((p,x)=>p+dur(x),0);return `<div class="c row" data-a=client data-i="${c.id}"><div><b>${esc(c.name)}</b>${db.active&&cOf(db.active.siteId)==c.id?' 🟢':''}<small>${n} chantier(s)</small></div><span>${hm(t)}</span></div>`}).join('')||'<p class=m>Aucun dossier pour le moment.</p>'}
const sites=()=>`<h1>📁 Mes dossiers</h1><button class=b data-a=newclient>+ Nouveau dossier</button><input id=q placeholder="🔎 Rechercher un dossier ou un chantier…" value="${esc(Q)}"><div id=list>${sList()}</div>`;
const PL={today:'Aujourd’hui',week:'Semaine',month:'Mois',year:'Année',all:'Tout'};
function clientV(){const c=client(V.i);if(!c)return'<p>Dossier introuvable</p>';const ss=db.sites.filter(x=>x.clientId==c.id).sort((a,b)=>a.name.localeCompare(b.name)),[a,b]=range(CP),v=agg(a,b,x=>cOf(x.siteId)==c.id);
return `<small>DOSSIER</small><h1>${esc(c.name)}</h1><div class=c>${info(c)}<button class=g data-a=cinfo>✏️ Infos du dossier</button></div>
<div class=chips>${Object.keys(PL).map(k=>`<button class="${CP==k?'on':''}" data-a=cper data-i=${k}>${PL[k]}</button>`).join('')}</div>
<div class=c><small>📊 ${PL[CP].toUpperCase()} · TOUS LES CHANTIERS</small><h1>${hm(v.tot)}</h1><small>Jours travaillés : ${v.days}</small>${gain(v.money)}</div>
<button class=b data-a=newsite>+ Nouveau chantier</button>
${ss.map(x=>`<div class="c row" data-a=site data-i="${x.id}"><div><b>${esc(x.name)}</b>${db.active&&db.active.siteId==x.id?' 🟢':''}<small>${esc(x.adr||'')}${x.rate?' · '+eur(x.rate)+'/h':''}</small></div><span>${hm(v.m[x.id]||0)}${v.e[x.id]?`<small style="text-align:right">${eur(v.e[x.id])}</small>`:''}</span></div>`).join('')||'<p class=m>Aucun chantier. Crée le premier !</p>'}
<button class=g data-a=renc>✏️ Renommer le dossier</button><button class=g style="color:var(--rd)" data-a=delc>🗑 Supprimer le dossier</button>`}
function byClient(r){const m={},e={};for(const id in r.m){const c=cOf(id);m[c]=(m[c]||0)+r.m[id];e[c]=(e[c]||0)+(r.e[id]||0)}return Object.entries(m).sort((x,y)=>y[1]-x[1]).map(([c,v])=>`<div class="c row" data-a=client data-i="${c}"><b>${esc((client(c)||{}).name)}</b><span>${hm(v)}${e[c]?`<small style="text-align:right">${eur(e[c])}</small>`:''}</span></div>`).join('')}
const sRow=s=>`<div class="c row" data-a=ses data-i="${s.id}"><div><b>${D(s.start)}</b><small>${T(s.start)} → ${T(s.end)}${dd(s.start)!=dd(s.end)?' (+1 j)':''}${s.edited?' · <span class=tag>Modifié manuellement</span>':''}</small></div><span>${hm(dur(s))}</span></div>`;
function sRes(s){if(!SD)return'';const t=new Date(SD+'T00:00').getTime(),e=dd(t,1),v=siteAgg(s.id,t,e),l=db.sessions.filter(x=>x.siteId==s.id&&ov(x,t,e)>0).sort((a,b)=>a.start-b.start);
return `<div class=c><small>${D(t)}</small><h2>${v.ms?hm(v.ms):'Aucun travail ce jour-là'}</h2>${v.money?`<h2>💶 ${eur(v.money)}</h2>`:''}</div>${l.map(sRow).join('')}`}
function siteV(){const s=site(V.i);if(!s)return'<p>Chantier introuvable</p>';const a=db.active,mine=a&&a.siteId==s.id,list=db.sessions.filter(x=>x.siteId==s.id).sort((x,y)=>y.start-x.start);
let btn=mine?runCard(true):a?`<div class=c>⚠️ Un compteur est déjà actif sur <b>${esc(site(a.siteId).name)}</b>.<button data-a=site data-i="${a.siteId}">Aller à ce chantier</button></div>`:`<button class=gr data-a=start>▶️ DÉMARRER LE TRAVAIL</button>`;
return `<small data-a=cup data-i="${s.clientId}" style="cursor:pointer;color:var(--ac)">📁 ${esc((client(s.clientId)||{}).name)} ›</small><h1>${esc(s.name)}</h1><div class=c><small>Temps total</small><h2>${hm(tot(s.id))}</h2><small>Sessions : ${list.length}</small></div>${siteStats(s)}${btn}<div class=c><small>INFOS DU CHANTIER</small>${info(s,client(s.clientId))}<button class=g data-a=sinfo>✏️ Modifier les infos</button></div>
<h3>🔎 Chercher une date</h3><div class=r><input type=date id=sd value="${SD}"><button class=g data-a=sdclr style="width:auto">✕</button></div><div id=sres>${sRes(s)}</div><h3>Historique</h3>${list.map(sRow).join('')||'<p class=m>Aucune session.</p>'}
<h3>Notes</h3><button data-a=nadd>+ Ajouter une note</button>${(s.notes||[]).map(n=>`<div class=c><div data-a=nedit data-i="${n.id}">${esc(n.t)||'<span class=m>(sans texte)</span>'}</div><div>${thumbs(n.ph,'n:'+n.id)}</div><div class=r><button class=g data-a=nphoto data-i="${n.id}">📷 Ajouter des photos</button><button class=g data-a=ndel data-i="${n.id}">🗑</button></div></div>`).join('')}
<button class=g data-a=ren>✏️ Renommer le chantier</button><button class="g" style="color:var(--rd)" data-a=delsite>🗑 Supprimer le chantier</button>`}
function sesV(){const s=ses(V.i);if(!s)return'<p>Session introuvable</p>';
return `<small>${esc(lab(s.siteId))}</small><h1>${D(s.start)}</h1><div class=c><b>${Ts(s.start)} → ${Ts(s.end)}</b><h2>Durée : ${hms(dur(s))}</h2>${rt(s)?`<h2>💶 ${eur(dur(s)/36e5*rt(s))}</h2><small>Tarif : ${eur(rt(s))}/h</small>`:''}${s.edited?`<span class=tag>Modifié manuellement</span><small>Original : ${D(s.orig.start)} ${T(s.orig.start)} → ${D(s.orig.end)} ${T(s.orig.end)}</small>`:''}</div>
<h3>📸 Photo de début</h3>${s.ps?`<img class=ph data-pid="${s.ps}" data-a=zoom data-i="${s.ps}"><small data-ts="${s.ps}"></small>`:'<p class=m>Aucune photo</p>'}
<h3>📸 Photo de fin</h3>${s.pe?`<img class=ph data-pid="${s.pe}" data-a=zoom data-i="${s.pe}"><small data-ts="${s.pe}"></small>`:'<p class=m>Aucune photo</p>'}
<h3>Note de la session</h3><div class=c>${esc(s.note)||'<span class=m>Aucune note</span>'}<div>${thumbs(s.nph,'s:'+s.id)}</div></div>
<button data-a=snote>📝 Note de la session</button><button data-a=sphoto>📷 Ajouter des photos à la note</button><button data-a=srate>💶 Tarif de cette session</button><button data-a=sedit>✏️ Modifier les heures</button><button class=g style="color:var(--rd)" data-a=sdel>🗑 Supprimer la session</button>`}
function calV(){const{y,m}=cal,first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
let g=['L','M','M','J','V','S','D'].map(x=>`<div class=h>${x}</div>`).join('')+'<div></div>'.repeat(first);
for(let d=1;d<=n;d++){const t=new Date(y,m,d).getTime(),a=agg(t,dd(t,1)).tot;g+=`<div data-a=day data-i="${t}" class="${a?'w ':''}${t==cal.sel?'s':''}">${d}${a?`<b>${hm(a)}</b>`:''}</div>`}
const ms=agg(new Date(y,m,1).getTime(),new Date(y,m+1,1).getTime()),k=(new Date(cal.sel).getDay()+6)%7,wk=agg(dd(cal.sel,-k),dd(cal.sel,7-k)),dy=agg(cal.sel,dd(cal.sel,1));
return `<h1>📅 Calendrier</h1><div class=r><button data-a=pm data-i=-1>◀</button><button class=g data-a=today>${new Date(y,m,1).toLocaleDateString('fr-BE',{month:'long',year:'numeric'})}</button><button data-a=pm data-i=1>▶</button></div><div class=c><div class=grid>${g}</div></div>
<div class=c><small>Total du mois</small><b>${hm(ms.tot)}</b> · <small style="display:inline">Semaine : ${hm(wk.tot)}</small></div>
<h3>${D(cal.sel)}</h3>${Object.entries(dy.m).map(([id,v])=>`<div class="c row" data-a=site data-i="${id}"><b>${esc(lab(id))}</b><span>${hm(v)}</span></div>`).join('')||'<p class=m>Rien de travaillé ce jour-là.</p>'}${dy.tot?`<p><b>Total : ${hm(dy.tot)}</b></p>`:''}`}
function range(p=P){const n=Date.now(),d=new Date(n),Y=d.getFullYear(),M=d.getMonth();if(p=='all')return[0,4e12];
if(p=='today')return[dd(n),dd(n,1)];if(p=='week'){const k=(d.getDay()+6)%7;return[dd(n,-k),dd(n,7-k)]}
if(p=='month')return[new Date(Y,M,1).getTime(),new Date(Y,M+1,1).getTime()];if(p=='year')return[new Date(Y,0,1).getTime(),new Date(Y+1,0,1).getTime()];
return[dd(new Date(C.a+'T00:00').getTime()),dd(new Date(C.b+'T00:00').getTime(),1)]}
function statV(){const L={today:'Aujourd’hui',week:'Cette semaine',month:'Ce mois',year:'Cette année',all:'Tout',custom:'Période personnalisée'},[a,b]=range(),r=agg(a,b);
return `<h1>📊 Statistiques</h1><div class=chips>${Object.keys(L).map(k=>`<button class="${P==k?'on':''}" data-a=per data-i=${k}>${L[k]}</button>`).join('')}</div>
${P=='custom'?`<div class=r><input type=date id=ca value="${C.a}"><input type=date id=cb value="${C.b}"></div>`:''}
<div class=c><small>📊 ${L[P].toUpperCase()}</small><small>Temps total</small><h1>${hm(r.tot)}</h1><small>Jours travaillés : ${r.days} · Chantiers : ${Object.keys(r.m).length}</small>${gain(r.money)||'<small>💶 Définis un tarif horaire dans tes chantiers pour voir tes gains</small>'}</div>
${byClient(r)}${r.tot?`<p><b>Total : ${hm(r.tot)}</b></p>`:''}`}
function render(){const v=V.t;const h={home,sites,site:siteV,ses:sesV,cal:calV,stat:statV,client:clientV}[v]();
$('#app').innerHTML=(['site','ses','client'].includes(v)?'<button class="bk" data-a=back>← Retour</button>':'')+h;
const root=['site','ses','client'].includes(v)?(H[0]||{t:'home'}).t:v;$('#nav').innerHTML=TABS.map(t=>`<button data-a=tab data-i=${t[0]} class="${root==t[0]?'on':''}"><i>${t[1]}</i>${t[2]}</button>`).join('');fill();tick()}
async function fill(){for(const e of document.querySelectorAll('img[data-pid]')){const p=await getP(e.dataset.pid);if(p){e.src=p.d;const cc=document.querySelector(`small[data-cap="${e.dataset.pid}"]`);if(cc)cc.textContent=p.c||'';const s=document.querySelector(`small[data-ts="${e.dataset.pid}"]`);if(s)s.textContent='Prise le '+D(p.ts)+' à '+T(p.ts)}}}
function tick(){const a=db.active,l=$('#live');if(!a||!l)return;const e=Date.now()-a.start;l.textContent=hms(e);
if(e>8*36e5){const w=$('#warn');w.style.display='block';w.textContent=`⚠️ Le compteur ${site(a.siteId).name} est actif depuis ${hm(e)}.`;
if(!a.n){a.n=1;save();try{Notification.permission=='granted'&&new Notification('Suivi chantiers',{body:w.textContent})}catch(x){}}}}
setInterval(tick,1000);document.addEventListener('visibilitychange',tick);

document.addEventListener('input',e=>{if(e.target.id=='q'){Q=e.target.value;$('#list').innerHTML=sList()}if(e.target.id=='sd'){SD=e.target.value;const x=$('#sres');if(x)x.innerHTML=sRes(site(V.i));fill()}if(e.target.id=='ca'||e.target.id=='cb'){C.a=$('#ca').value||C.a;C.b=$('#cb').value||C.b;render()}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i;
if(a=='tab'){V={t:i};H=[];render()}
else if(a=='site'||a=='ses'||a=='client'){if(a=='site')SD='';H.push(V);V={t:a,i};render()}
else if(a=='back'){V=H.pop()||{t:'home'};render()}
else if(a=='newclient'){const r=await ask('Nouveau dossier',{msg:'Une entreprise, un client…',fields:[{label:'Nom du dossier'},{label:'Adresse (facultatif)'},{label:'Téléphone (facultatif)',type:'tel'},{label:'E-mail (facultatif)',type:'email'}],ok:'Créer'});if(r&&r[0].trim()){const c={id:uid(),name:r[0].trim(),adr:r[1].trim(),tel:r[2].trim(),mail:r[3].trim()};db.clients.push(c);save();H.push(V);V={t:'client',i:c.id};render()}}
else if(a=='newsite'){const r=await ask('Nouveau chantier',{fields:[{label:'Nom du chantier'},{label:'Adresse (facultatif)'},{label:'Tarif par heure en € (facultatif)',type:'number'}],ok:'Créer'});if(r&&r[0].trim()){const x=parseFloat(String(r[2]).replace(',','.')),n={id:uid(),clientId:V.i,name:r[0].trim(),adr:r[1].trim(),notes:[],rate:x>0?x:null};db.sites.push(n);save();H.push(V);V={t:'site',i:n.id};render()}}
else if(a=='cup'){V={t:'client',i};H=[{t:'sites'}];render()}
else if(a=='cper'){CP=i;render()}
else if(a=='cinfo'||a=='sinfo'){const o=a=='cinfo'?client(V.i):site(V.i),r=await ask(a=='cinfo'?'Infos du dossier':'Infos du chantier',{msg:a=='sinfo'?'Vide = on utilise les infos du dossier.':'',fields:[{label:'Adresse',val:o.adr},{label:'Téléphone',type:'tel',val:o.tel},{label:'E-mail',type:'email',val:o.mail}]});if(r){o.adr=r[0].trim();o.tel=r[1].trim();o.mail=r[2].trim();save();render()}}
else if(a=='renc'){const c=client(V.i),r=await ask('Renommer le dossier',{fields:[{label:'Nom',val:c.name}]});if(r&&r[0].trim()){c.name=r[0].trim();save();render()}}
else if(a=='delc'){const c=client(V.i),ss=db.sites.filter(x=>x.clientId==c.id);if(db.active&&ss.some(x=>x.id==db.active.siteId))return toast('Terminez d’abord le compteur');const n=db.sessions.filter(x=>ss.some(y=>y.id==x.siteId)).length;if(await ask('Supprimer ce dossier ?',{msg:`« ${esc(c.name)} », ses ${ss.length} chantier(s) et ses ${n} session(s) seront supprimés définitivement.`,ok:'Supprimer',red:1})){db.sessions=db.sessions.filter(x=>!ss.some(y=>y.id==x.siteId));db.sites=db.sites.filter(x=>x.clientId!=c.id);db.clients=db.clients.filter(x=>x.id!=c.id);save();V=H.pop()||{t:'sites'};render()}}
else if(a=='srate'){const x=ses(V.i),r=await ask('Tarif de cette session',{msg:'Vide = tarif du chantier.',fields:[{label:'Montant par heure (€)',type:'number',val:x.rate!=null?x.rate:''}]});if(r){const n=parseFloat(String(r[0]).replace(',','.'));x.rate=n>=0?n:null;save();render()}}
else if(a=='start'||a=='resume'){const sid=a=='start'?V.i:i;if(db.active)return toast('Un compteur est déjà actif');db.active={siteId:sid,start:Date.now(),ps:null};save();try{Notification.requestPermission()}catch(x){}render();const p=await takePhoto();if(p&&db.active){db.active.ps=p;save();render()}}
else if(a=='pstart'){const p=await takePhoto();if(p&&db.active){db.active.ps=p;save();render()}}
else if(a=='stop'){const x=db.active;const ok=await ask('Terminer le travail ?',{msg:'Durée : <b id=lv></b><br>Une photo de fin va t’être proposée.',live:()=>hms(Date.now()-x.start),ok:'Terminer'});if(!ok)return;const end=Date.now();
const pe=await takePhoto();db.sessions.push({id:uid(),siteId:x.siteId,start:x.start,end,note:'',ps:x.ps,pe,edited:false,rate:(site(x.siteId)||{}).rate||null});db.active=null;save();render();toast('Session enregistrée ✅')}
else if(a=='ren'){const s=site(V.i),r=await ask('Renommer',{fields:[{label:'Nom',val:s.name}]});if(r&&r[0].trim()){s.name=r[0].trim();save();render()}}
else if(a=='delsite'){const s=site(V.i);if(db.active&&db.active.siteId==s.id)return toast('Terminez d’abord le compteur');const n=db.sessions.filter(x=>x.siteId==s.id).length;if(await ask('Supprimer ce chantier ?',{msg:`« ${esc(s.name)} » et ses ${n} session(s) seront supprimés définitivement.`,ok:'Supprimer',red:1})){db.sessions=db.sessions.filter(x=>x.siteId!=s.id);db.sites=db.sites.filter(x=>x.id!=s.id);save();V=H.pop()||{t:'sites'};render()}}
else if(a=='nadd'){const r=await ask('Nouvelle note',{fields:[{area:1}],ok:'Ajouter'});if(r&&r[0].trim()){(site(V.i).notes=site(V.i).notes||[]).push({id:uid(),t:r[0].trim()});save();render()}}
else if(a=='nedit'){const n=site(V.i).notes.find(x=>x.id==i),r=await ask('Modifier la note',{fields:[{area:1,val:n.t}]});if(r&&r[0].trim()){n.t=r[0].trim();save();render()}}
else if(a=='ndel'){if(await ask('Supprimer la note ?',{ok:'Supprimer',red:1})){const s=site(V.i);s.notes=s.notes.filter(x=>x.id!=i);save();render()}}
else if(a=='snote'){const s=ses(V.i),r=await ask('Note de la session',{fields:[{area:1,val:s.note}]});if(r){s.note=r[0];save();render()}}
else if(a=='sedit'){const s=ses(V.i),r=await ask('Modifier les heures',{msg:'L’original sera conservé.',fields:[{label:'Début',type:'datetime-local',val:loc(s.start)},{label:'Fin',type:'datetime-local',val:loc(s.end)}]});
if(r){const st=new Date(r[0]).getTime(),en=new Date(r[1]).getTime();if(!(st&&en)||en<=st)return toast('La fin doit être après le début');if(!s.edited){s.orig={start:s.start,end:s.end};s.edited=true}s.start=st;s.end=en;save();render()}}
else if(a=='sdel'){if(await ask('Supprimer cette session ?',{ok:'Supprimer',red:1})){db.sessions=db.sessions.filter(x=>x.id!=V.i);save();V=H.pop()||{t:'home'};render()}}
else if(a=='pm'){cal.m+=+i;if(cal.m>11){cal.m=0;cal.y++}if(cal.m<0){cal.m=11;cal.y--}render()}
else if(a=='today'){const n=new Date();cal={y:n.getFullYear(),m:n.getMonth(),sel:dd(n)};render()}
else if(a=='day'){cal.sel=+i;render()}
else if(a=='per'){P=i;render()}
else if(a=='sper'){SP=i;render()}
else if(a=='nphoto'){const ids=await pickMany();if(ids.length){await captionPhotos(ids);const n=site(V.i).notes.find(x=>x.id==i);n.ph=(n.ph||[]).concat(ids);save();render()}}
else if(a=='sphoto'){const ids=await pickMany();if(ids.length){await captionPhotos(ids);const x=ses(V.i);x.nph=(x.nph||[]).concat(ids);save();render()}}
else if(a=='zoom'){const p=await getP(i);if(!p)return;const z=document.createElement('div');z.className='zm';z.innerHTML=`<img src="${p.d}" data-a=zclose><div id=zcap style="color:#fff;padding:10px 16px;text-align:center">${esc(p.c)}</div><div class=r style="max-width:420px;width:100%;padding:12px"><button data-a=pcap data-i="${i}">📝 Note</button><button data-a=zclose>Fermer</button>${el.dataset.o?`<button class=red data-a=delph data-i="${i}" data-o="${el.dataset.o}">🗑 Retirer</button>`:''}</div>`;document.body.append(z)}
else if(a=='pcap'){const p=await getP(i);if(!p)return;const r=await ask('Note de la photo',{fields:[{area:1,val:p.c||''}]});if(r){p.c=r[0].trim();await putP(i,p);const e=document.querySelector('#zcap');if(e)e.textContent=p.c;fill()}}
else if(a=='sdclr'){SD='';render()}
else if(a=='zclose'){const z=document.querySelector('.zm');z&&z.remove()}
else if(a=='delph'){if(await ask('Retirer cette photo ?',{ok:'Retirer',red:1})){const[k,id]=el.dataset.o.split(':'),o=k=='n'?site(V.i).notes.find(x=>x.id==id):ses(V.i),key=k=='n'?'ph':'nph';o[key]=(o[key]||[]).filter(x=>x!=i);save();const z=document.querySelector('.zm');z&&z.remove();render()}}
else if(a=='rate'){const s=site(V.i),r=await ask('Tarif horaire',{msg:'Ce tarif sera utilisé pour les prochaines sessions. Les sessions déjà enregistrées avec un tarif gardent le leur.',fields:[{label:'Montant par heure (€)',type:'number',val:s.rate||''}]});if(r){const x=parseFloat(String(r[0]).replace(',','.'));s.rate=x>0?x:null;save();render()}}});
render();
</script></body></html>
